[project]
name = "nightingale-api"
version = "0.1.0"
description = "Transactional API and synchronization service for Nightingale"
readme = "README.md"
authors = [
    { name = "Pedro", email = "87550035+odiseo0@users.noreply.github.com" }
]
requires-python = ">=3.15.1"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.159.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
nightingale-api = "src.application:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
